name: Windows

on:
  push:
    branches: [main, windows-support]
  pull_request:
  workflow_dispatch:

jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Enable pinned pnpm
        shell: pwsh
        run: corepack enable
      - name: Compile and complete native Python suites
        shell: pwsh
        run: |
          python -m compileall -q Windows RemoteAgent
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          python -m unittest discover -s RemoteAgent/tests -p 'test*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'RemoteAgent suite failed' }
          python -m unittest discover -s Windows/tests -p 'test*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows feature suite failed' }
          python -m unittest discover -s Windows/examples -p 'test*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CLI suite failed' }
      - name: Frozen Dashboard install, tests and production build
        shell: pwsh
        working-directory: Dashboard
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard install failed' }
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard tests failed' }
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard build failed' }
      - name: Native install, authenticated lifecycle and package
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'modelmatrix isolated smoke'
          $install = Join-Path $root 'installed code'
          $data = Join-Path $root 'data'
          $package = Join-Path $root 'packages'
          $tokenFile = Join-Path $root 'controller.token'
          New-Item -ItemType Directory -Force $root | Out-Null
          [guid]::NewGuid().ToString('N') | Set-Content -LiteralPath $tokenFile -Encoding UTF8
          & .\Scripts\install-windows.ps1 -SourceRoot $pwd -InstallRoot $install -DataRoot $data -PythonPath (Get-Command python).Source -NoBuild -NoShortcuts
          if (-not (Test-Path (Join-Path $install 'Dashboard\dist\index.html'))) { throw 'Dashboard not staged' }
          try {
            & .\Scripts\start-windows.ps1 -InstallRoot $install -DataRoot $data -Port 17770 -RelayPort 17771 -AuthTokenFile $tokenFile -NoBrowser
            & .\Scripts\verify-windows.ps1 -InstallRoot $install -DataRoot $data -Port 17770 -AuthTokenFile $tokenFile
            & .\Scripts\stop-windows.ps1 -DataRoot $data -AuthTokenFile $tokenFile
            & .\Scripts\start-windows.ps1 -InstallRoot $install -DataRoot $data -Port 17770 -RelayPort 17771 -AuthTokenFile $tokenFile -NoBrowser
            & .\Scripts\stop-windows.ps1 -DataRoot $data -AuthTokenFile $tokenFile
          } finally {
            if (Test-Path (Join-Path $data 'run\controller.pid')) {
              & .\Scripts\stop-windows.ps1 -DataRoot $data -AuthTokenFile $tokenFile
            }
          }
          & .\Scripts\package-windows.ps1 -SourceRoot $pwd -OutputDirectory $package -Version ci -SkipBuild
          if (-not (Test-Path (Join-Path $package 'ModelMatrix-ci-windows.zip'))) { throw 'Package missing' }
          $marker = Join-Path $data 'profiles\preserved.txt'
          'preserve' | Set-Content -LiteralPath $marker
          & .\Scripts\uninstall-windows.ps1 -InstallRoot $install -DataRoot $data -KeepStartup
          if (-not (Test-Path $marker)) { throw 'Uninstall did not retain user data' }
